name: Publicar en GitHub Pages

# Corre el PHP del proyecto tal cual, genera el HTML de todas las páginas
# y lo publica en la rama gh-pages (https://webteveo.github.io/probando-creditos-en-la-nube/).
on:
  push:
    branches: [claude/compassionate-albattani-h50hmf, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Generar sitio
        run: php .github/pages/build.php "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Publicar en gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
