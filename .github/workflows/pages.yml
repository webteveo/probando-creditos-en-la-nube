name: Publicar en GitHub Pages

# Copia el contenido de la rama principal a gh-pages en cada push.
# GitHub Pages sirve la rama gh-pages y se actualiza solo.
on:
  push:
    branches: [claude/compassionate-albattani-h50hmf, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publicar en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/gh-pages
