name: Probar imagen Docker

# En cada push construye el sitio tal como corre en producción y verifica las rutas principales.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t cerrajero .
      - name: Levantar sitio
        run: |
          docker run -d --name sitio -p 8080:10000 -e PORT=10000 cerrajero
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/robots.txt && break; sleep 1; done
      - name: Verificar rutas
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8080$1")
            echo "$1 -> $code (esperado $2)"
            [ "$code" = "$2" ]
          }
          fail=0
          for p in / /contacto /articulos /paginas/servicios /paginas/zonas /local/cerrajero-pocitos /resena /metricas /sitemap.xml /llms.txt /favicon.ico /public/css/style.css; do
            check "$p" 200 || fail=1
          done
          check /config/variables.php 403 || fail=1
          check /no-existe 404 || fail=1
          if docker logs sitio 2>&1 | grep -E "PHP (Fatal|Parse)"; then fail=1; fi
          exit $fail
